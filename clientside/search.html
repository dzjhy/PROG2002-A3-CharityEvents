<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Events</title>
    <link rel="stylesheet" href="style.css">
</head>

<footer>
    <div class="footer-content">
        <div>
            <h3>Helping Hands Foundation</h3>
            <p>Connecting communities through meaningful charity events.</p>
        </div>

        <div>
            <p>Email: contact@helpinghands.org</p>
            <p>© 2026 Helping Hands Foundation</p>
        </div>
    </div>
</footer>

<body>

<nav class="navbar">
    <a class="brand" href="index.html">Helping Hands</a>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="search.html">Search Events</a>
    </div>
</nav>
<main>
    <h1>Search Charity Events</h1>

    <form id="search-form">
        <label>
            City:
            <input type="text" id="city">
        </label>

        <br><br>

        <label>
            Date:
            <input type="date" id="date">
        </label>

        <br><br>

        <label>
            Location:
            <input type="text" id="location">
        </label>

        <br><br>

        <label>
            Category:
            <select id="category">
                <option value="">All Categories</option>
            </select>
        </label>

        <br><br>

        <button type="submit">Search</button>
        <button type="button" id="clear-btn">Clear Filters</button>
    </form>

    <hr>

    <h2>Search Results</h2>
    <div id="search-results">
        <p>Use the form above to search for events.</p>
    </div>
</main>

<script src="search.js"></script>
</body>
</html>
